plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dokpamine'
version = '0.0.1-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

configurations { mockitoAgent }

dependencies {
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    mockitoAgent('org.mockito:mockito-core') { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += '-parameters'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // Java 21에서 테스트 중 동적 attach 없이 Mockito를 사용할 수 있도록 시작 시 로드한다.
    jvmArgs "-javaagent:${configurations.mockitoAgent.singleFile}"
}

tasks.register('postgresqlTest', Test) {
    group = 'verification'
    description = 'Runs Flyway, feed search, and concurrent record/like writes against PostgreSQL.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    filter {
        includeTestsMatching 'FeedApiTest'
        includeTestsMatching 'RecordInsertRaceApiTest'
        includeTestsMatching 'FeedLikeRaceApiTest'
    }

    systemProperty 'dokpamine.test.postgresql.url', providers.environmentVariable('POSTGRES_TEST_URL')
            .orElse('jdbc:postgresql://127.0.0.1:5432/dokpamine_test').get()
    systemProperty 'spring.datasource.driver-class-name', 'org.postgresql.Driver'
    systemProperty 'spring.datasource.username', providers.environmentVariable('POSTGRES_TEST_USER')
            .orElse('dokpamine').get()
    systemProperty 'spring.datasource.password', providers.environmentVariable('POSTGRES_TEST_PASSWORD')
            .orElse('dokpamine').get()

    // DB 상태는 Gradle이 추적할 수 없으므로 빈 DB에서도 검증을 매번 실행한다.
    doNotTrackState('PostgreSQL state is external to Gradle')
}
