spring:
  application:
    name: dokpamine-be
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080

dokpamine:
  jwt:
    # 운영에서는 반드시 DOKPAMINE_JWT_SECRET 환경 변수로 32바이트 이상 값을 넣는다.
    secret: ${DOKPAMINE_JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    ttl: 14d
  catalog:
    # 국립중앙도서관(쪽수·KDC 우선) → 카카오(국내 도서 제목·표지 보완) → Google Books → Open Library(마지막 대체).
    # 키가 없는 조회처는 건너뛰고 앞 결과의 빈 칸만 뒤 결과로 채운다. Open Library는 키가 필요 없다.
    nlk-cert-key: ${NLK_CERT_KEY:}
    kakao-rest-api-key: ${KAKAO_REST_API_KEY:}
    google-books-key: ${GOOGLE_BOOKS_KEY:}
    timeout: 4s

management:
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/dokpamine;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dokpamine}
    username: ${DB_USERNAME:dokpamine}
    password: ${DB_PASSWORD:dokpamine}
