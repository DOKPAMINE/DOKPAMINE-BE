spring:
  application:
    name: dokpamine-be
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080

springdoc:
  paths-to-match: /api/**

dokpamine:
  jwt:
    ttl: 14d
  catalog:
    # 국립중앙도서관(쪽수 우선) → 정보나루(KDC) → 카카오(국내 도서 제목·표지 보완) → Google Books → Open Library(마지막 대체).
    # 키가 없는 조회처는 건너뛰고 앞 결과의 빈 칸만 뒤 결과로 채운다. Open Library는 키가 필요 없다.
    nlk-cert-key: ${NLK_CERT_KEY:}
    kakao-rest-api-key: ${KAKAO_REST_API_KEY:}
    google-books-key: ${GOOGLE_BOOKS_KEY:}
    # 국립중앙도서관은 KDC를 거의 주지 않아 도서관 정보나루의 KDC로 장르를 보완한다.
    data4library-auth-key: ${DATA4LIBRARY_AUTH_KEY:}
    # YES24는 기존 조회와 동시에 ISBN 상세에서 표지·분야·쪽수를 조회한다.
    yes24-api-key: ${YES24_API_KEY:}
    timeout: 4s

management:
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/dokpamine;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true

dokpamine:
  jwt:
    secret: ${DOKPAMINE_JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dokpamine}
    username: ${DB_USERNAME:dokpamine}
    password: ${DB_PASSWORD:dokpamine}

dokpamine:
  jwt:
    secret: ${DOKPAMINE_JWT_SECRET:}
